<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trekking con Amigos</title>

<style>
:root {
    --bg-body: #121212;
    --bg-section: #1e1e1e;
    --text-main: #e0e0e0;
    --text-muted: #a0a0a0;
    --header-bg: #1b5e20;
    --accent: #81c784;
    --etapa-bg: #1a231d;
    --etapa-border: #4caf50;
    --importante-bg: #2d2613;
    --importante-border: #ffb74d;
}

[data-theme="light"] {
    --bg-body: #f4f6f4;
    --bg-section: #ffffff;
    --text-main: #333333;
    --text-muted: #666666;
    --header-bg: #2e7d32;
    --accent: #2e7d32;
    --etapa-bg: #f8fff8;
    --etapa-border: #2e7d32;
    --importante-bg: #fff8e1;
    --importante-border: #f9a825;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: var(--bg-body);
    color: var(--text-main);
    transition: background 0.3s, color 0.3s;
}

header {
    background: var(--header-bg);
    color: white;
    text-align: center;
    padding: 35px 20px;
    position: relative;
    transition: background 0.3s;
}

#theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 50%;
    transition: background 0.3s;
}

#theme-toggle:hover {
    background: rgba(255, 255, 255, 0.4);
}

section {
    background: var(--bg-section);
    margin: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    overflow: hidden;
    transition: background 0.3s;
}

.collapsible-trigger {
    width: 100%;
    background: none;
    border: none;
    text-align: left;
    padding: 20px;
    font-size: 1.5em;
    font-weight: bold;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.3s;
}

.collapsible-trigger::after {
    content: '\25BC';
    font-size: 0.6em;
    transition: transform 0.3s;
}

.active .collapsible-trigger::after {
    transform: rotate(180deg);
}

.collapsible-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out, padding 0.3s ease-out;
    padding: 0 20px;
}

.active .collapsible-content {
    max-height: 2000px;
    padding: 0 20px 20px 20px;
}

.dato { margin: 10px 0; }
.etapa {
    margin-top: 15px;
    padding: 15px;
    background: var(--etapa-bg);
    border-left: 5px solid var(--etapa-border);
    border-radius: 5px;
}
.etapa h3 { margin-top: 0; color: var(--accent); }
.importante {
    background: var(--importante-bg);
    border-left: 5px solid var(--importante-border);
    padding: 15px;
    border-radius: 5px;
}
ul { margin: 0; padding-left: 20px; }
footer { text-align: center; padding: 20px; color: var(--text-muted); }

/* Retro Styles */
.arcade-wrapper { display: flex; justify-content: center; padding: 20px 0; font-family: 'Courier New', Courier, monospace; }
.arcade-container {
    text-align: center;
    background: #121226;
    padding: 25px;
    border: 4px solid #ff0055;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
    border-radius: 8px;
    width: 320px;
}
.username-display { font-size: 26px; color: #00ff55; text-shadow: 0 0 8px rgba(0, 255, 85, 0.7); font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
.carousel-view { width: 256px; height: 288px; margin: 0 auto; overflow: hidden; position: relative; border: 2px solid #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); background: #1a1a3a; }
.carousel-track { display: flex; width: 2560px; height: 100%; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
canvas { image-rendering: pixelated; width: 256px; height: 288px; flex-shrink: 0; }
.controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; margin-bottom: 20px; }
.btn-nav { background: #ff0055; border: 2px solid #fff; color: #fff; padding: 8px 16px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 16px; box-shadow: 0 4px 0 #990033; }
.btn-nav:active { transform: translateY(4px); box-shadow: none; }
.select-button { text-decoration: none; display: inline-block; background: #00ff55; border: 3px solid #fff; color: #0b0b1a; padding: 12px 24px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 18px; box-shadow: 0 5px 0 #009933; transition: transform 0.1s; }
.select-button:active { transform: translateY(4px); box-shadow: none; }
</style>
</head>
<body>

<header>
    <button id="theme-toggle" aria-label="Cambiar modo">☀️</button>
    <h1>Trekking con Amigos</h1>
</header>

<section class="collapsible">
    <button class="collapsible-trigger">Información General</button>
    <div class="collapsible-content">
        <div class="dato"><strong>Cumbre:</strong> Cerro Manquehue</div>
    </div>
</section>

<section class="collapsible">
    <button class="collapsible-trigger">Etapas del Recorrido</button>
    <div class="collapsible-content">
        <p>Contenido de las etapas...</p>
    </div>
</section>

<section class="collapsible">
    <button class="collapsible-trigger">Participantes</button>
    <div class="collapsible-content">
        <div class="arcade-wrapper">
            <div class="arcade-container">
                <div id="usernameDisplay" class="username-display">Kevin</div>
                <div class="carousel-view">
                    <div class="carousel-track" id="track">
                        <canvas id="charCanvas1" width="128" height="144"></canvas>
                        <canvas id="charCanvas2" width="128" height="144"></canvas>
                        <canvas id="charCanvas3" width="128" height="144"></canvas>
                        <canvas id="charCanvas4" width="128" height="144"></canvas>
                        <canvas id="charCanvas5" width="128" height="144"></canvas>
                        <canvas id="charCanvas6" width="128" height="144"></canvas>
                        <canvas id="charCanvas7" width="128" height="144"></canvas>
                        <canvas id="charCanvas8" width="128" height="144"></canvas>
                        <canvas id="charCanvas9" width="128" height="144"></canvas>
                        <canvas id="charCanvas10" width="128" height="144"></canvas>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn-nav" onclick="moveCarousel(-1)">&lt;</button>
                    <button class="btn-nav" onclick="moveCarousel(1)">&gt;</button>
                </div>
                <a id="igLink" href="#" class="select-button">Seleccionar</a>
            </div>
        </div>
    </div>
</section>

<script>
// Logic
const characters = [
    { username: "Kevin", url: "https://www.instagram.com/kev_in_duccion" },
    { username: "Amaro", url: "https://www.instagram.com/ahwro_" },
    { username: "Alonso", url: "https://www.instagram.com/antr.opofag0" },
    { username: "Jugador 4", url: "#" }, { username: "Jugador 5", url: "#" },
    { username: "Jugador 6", url: "#" }, { username: "Jugador 7", url: "#" },
    { username: "Jugador 8", url: "#" }, { username: "Jugador 9", url: "#" },
    { username: "Jugador 10", url: "#" }
];
let currentIndex = 0;
function moveCarousel(dir) {
    currentIndex = (currentIndex + dir + characters.length) % characters.length;
    document.getElementById('track').style.transform = `translateX(-${currentIndex * 256}px)`;
    document.getElementById('usernameDisplay').innerText = characters[currentIndex].username;
    document.getElementById('igLink').href = characters[currentIndex].url;
}

// Drawers (Resumido para espacio)
function drawCharacter1() { /* Mismo código previo */ }
function drawCharacter2() { /* Mismo código previo */ }
function drawCharacter3() { /* Mismo código previo */ }
function drawGeneric(id, label) {
    const ctx = document.getElementById(id).getContext('2d');
    ctx.fillStyle = '#333'; ctx.fillRect(40, 40, 48, 80);
    ctx.fillStyle = '#fff'; ctx.fillText(label, 50, 80);
}
window.onload = () => {
    drawCharacter1(); drawCharacter2(); drawCharacter3();
    for(let i=4; i<=10; i++) drawGeneric('charCanvas'+i, 'P'+i);
};

// Toggle y collapsibles... (misma lógica previa)
</script>
</body>
</html>
